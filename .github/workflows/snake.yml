name: Generate Snake Animation

on:
  # Menjalankan aksi secara otomatis setiap 24 jam
  schedule:
    - cron: "0 */24 * * *" 
  
  # Memungkinkan Anda menjalankan aksi secara manual kapan saja
  workflow_dispatch:
  
  # Menjalankan aksi setiap kali ada push ke cabang utama (main/master)
  push:
    branches:
    - main
    - master
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Membuat animasi snake dari grafik kontribusi GitHub Anda
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        
      # Mengunggah (push) file SVG yang dihasilkan ke cabang 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
